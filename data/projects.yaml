# The Projects page lists repos you own that are pinned on your GitHub profile or starred by you.
# Pinned repos come first, in profile order. Change pins or stars on GitHub; the site picks it up
# on the next build (at least daily).

# Leave these repos off the site even if pinned or starred:
hide: []

# Project icons: the first README image whose alt text or path mentions "logo" or "icon"; else the
# first of docs/icon.svg, docs/assets/icon.svg, docs/logo.svg, icon.svg, logo.svg, .github/icon.svg,
# docs/icon.png, icon.png that exists in the repo. Override here: repo name -> path in the repo, or a URL.
icons: {}

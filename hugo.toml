# The stack passes --baseURL from SITE_HOST; this value is for local previews.
baseURL = "https://nulteck.com/"
title = "nulifyer"
locale = "en-US"
theme = "buffer"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[pagination]
  pagerSize = 20

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.highlight]
  noClasses = false   # Gruvbox colours come from the theme's chroma.css

[markup.goldmark.renderer]
  unsafe = true       # project READMEs often contain raw HTML

[caches.getresource]
  maxAge = "10m"      # keeps rebuilds from hammering the GitHub API

[params]
  description = "Write-ups on the things I build, and the projects they're about."
  intro = "Write-ups on the things I build, and the projects they're about."
  author = "nulifyer"
  avatar = "icon-source.png"   # asset path; cropped square for the home page, schema and cards
  mainSections = ["posts"]

  [params.github]
    user = "nulifyer"

  [[params.social]]
    name = "github"
    label = "github.com/nulifyer"
    url = "https://github.com/nulifyer"
    icon = "github"

[[menu.main]]
  name = "posts"
  url = "/posts/"
  weight = 10
  params = { icon = "file-text" }

[[menu.main]]
  name = "projects"
  url = "/projects/"
  weight = 20
  params = { icon = "book" }

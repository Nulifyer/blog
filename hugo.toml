# Production URL comes from the workflow's --baseURL; this value is for local previews.
baseURL = "https://blog.swarm.nulteck.com/"
title = "nulifyer"
theme = "PaperMod"
enableRobotsTXT = true
enableGitInfo = false
disableKinds = ["taxonomy", "term"]

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
  unsafe = true   # project READMEs often contain raw HTML

[caches.getresource]
  maxAge = "10m"  # keeps local rebuilds from hammering the GitHub API

[params]
  env = "production"
  description = "Posts and projects by nulifyer"
  mainSections = ["posts"]
  defaultTheme = "auto"
  ShowBreadCrumbs = true
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

  intro = "Write-ups on the things I build, and the projects they're about."

  [params.github]
    user = "nulifyer"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/nulifyer"
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

[menu]
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    name = "Projects"
    url = "/projects/"
    weight = 20

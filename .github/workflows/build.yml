name: Build site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"   # daily, so new repos, READMEs and stars reach the Projects page
  workflow_dispatch:

permissions:
  contents: write          # push the built site to the `site` branch

concurrency:
  group: build-site
  cancel-in-progress: false

env:
  HUGO_IMAGE: ghcr.io/gohugoio/hugo:v0.170.1
  # Set the repo variable BASE_URL to move the site to another domain.
  BASE_URL: ${{ vars.BASE_URL || 'https://blog.swarm.nulteck.com/' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build with Hugo
        env:
          HUGO_GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/project" \
            -e HUGO_GITHUB_TOKEN -e HUGO_CACHEDIR=/tmp/hugo_cache \
            "$HUGO_IMAGE" build --minify --gc --baseURL "$BASE_URL"

      - name: Publish to the site branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: site
          publish_dir: ./public
          force_orphan: true      # keep one commit, so the homelab clone stays small
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: "Build ${{ github.sha }}"

{{- $index := "" }}{{ with site.Home.OutputFormats.Get "json" }}{{ $index = .RelPermalink }}{{ end }}
<div class="site-search" role="search" data-index="{{ $index }}" hidden>
    <label for="site-search-input" class="visually-hidden">Search posts and projects</label>
    <svg class="site-search-icon" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input id="site-search-input" type="search" placeholder="Search" autocomplete="off" spellcheck="false"
        role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="site-search-results">
    <kbd class="site-search-key" aria-hidden="true">/</kbd>
    <div class="site-search-panel" hidden>
        <ul id="site-search-results" role="listbox" aria-label="Suggestions"></ul>
        <p class="site-search-message" hidden></p>
    </div>
    <p class="visually-hidden" aria-live="polite" id="site-search-status"></p>
</div>

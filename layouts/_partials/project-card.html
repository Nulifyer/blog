<article class="post-entry">
  <header class="entry-header">
    <h2 class="entry-hint-parent">{{ .Title }}{{ if gt .Params.featured_rank 0 }} <span class="entry-hint" title="Featured">★</span>{{ end }}</h2>
  </header>
  {{- with .Params.description }}
  <div class="entry-content"><p>{{ . }}</p></div>
  {{- end }}
  <footer class="entry-footer">
    {{- with .Params.language }}<span>{{ . }}</span>&nbsp;·&nbsp;{{ end -}}
    <span>{{ .Params.stars }} {{ cond (eq .Params.stars 1) "star" "stars" }}</span>&nbsp;·&nbsp;
    <span>Updated {{ .Lastmod | time.Format ":date_medium" }}</span>
  </footer>
  <a class="entry-link" aria-label="project page for {{ .Title }}" href="{{ .Permalink }}"></a>
</article>

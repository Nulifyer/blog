<article class="project-card">
  {{ partial "project-icon.html" (dict "page" . "size" 40) }}
  <div class="project-card-body">
    <h3 class="project-card-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    {{- with .Params.description }}<p class="project-card-desc">{{ . }}</p>{{ end }}
    <p class="project-card-meta">
      {{- with .Params.language }}<span>{{ . }}</span>{{ end }}
      <span>{{ .Params.stars }} {{ cond (eq .Params.stars 1) "star" "stars" }}</span>
      <span>Updated {{ .Lastmod | time.Format ":date_medium" }}</span>
    </p>
  </div>
</article>

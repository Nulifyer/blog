<link rel="manifest" href="{{ "site.webmanifest" | relURL }}">
{{- range site.Params.socialIcons }}{{ if ne .name "rss" }}
<link rel="me" href="{{ .url }}">
{{- end }}{{ end }}
{{- with partial "templates/_funcs/get-page-images" . }}{{ with index . 0 }}
<meta property="og:image:alt" content="{{ $.Title | default site.Title }}">
{{- end }}{{ end }}
<script>
  // Match the browser toolbar to the active theme, including after the theme toggle.
  (() => {
    const meta = document.querySelector('meta[name="theme-color"]');
    const root = document.documentElement;
    const sync = () => { if (meta) meta.content = root.dataset.theme === "dark" ? "#202020" : "#fbf1c7"; };
    sync();
    new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
  })();
</script>

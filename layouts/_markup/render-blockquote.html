{{- /* GitHub-style alerts: > [!NOTE], [!TIP], [!IMPORTANT], [!WARNING], [!CAUTION]. */ -}}
{{- if eq .Type "alert" -}}
<blockquote class="alert alert-{{ .AlertType }}">
  <p class="alert-title">{{ .AlertTitle | default (title .AlertType) }}</p>
  {{ .Text }}
</blockquote>
{{- else -}}
<blockquote>
  {{ .Text }}
</blockquote>
{{- end -}}

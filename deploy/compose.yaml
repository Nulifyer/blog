# Portainer stack "blog" on endpoint 7 (mage).
# git-sync pulls the built site from the `site` branch; nginx serves it; Traefik routes the hostname.
x-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

name: blog

services:
  sync:
    image: registry.k8s.io/git-sync/git-sync:v4.8.0
    restart: unless-stopped
    user: "65533:65533"
    command:
      - --repo=https://github.com/nulifyer/blog
      - --ref=site
      - --depth=1
      - --period=60s
      - --root=/git
      - --link=current
    volumes:
      - site:/git
    logging: *service-logging

  web:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on: [sync]
    configs:
      - source: nginx-site
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - site:/git:ro
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.blog-http.entrypoints=web"
      - "traefik.http.routers.blog-http.rule=Host(`blog.swarm.nulteck.com`)"
      - "traefik.http.routers.blog-http.middlewares=https-redirect"

      - "traefik.http.routers.blog-https.entrypoints=websecure"
      - "traefik.http.routers.blog-https.rule=Host(`blog.swarm.nulteck.com`)"
      - "traefik.http.services.blog.loadbalancer.server.scheme=http"
      - "traefik.http.services.blog.loadbalancer.server.port=80"
    logging: *service-logging

configs:
  nginx-site:
    content: |
      server {
        listen 80;
        server_name _;
        root /git/current;
        index index.html;
        absolute_redirect off;
        error_page 404 /404.html;

        location / {
          try_files $$uri $$uri/ =404;
        }
        location ~* \.(css|js|svg|png|jpe?g|gif|webp|ico|woff2?)$$ {
          expires 7d;
        }
        location ~ /\.git { deny all; }

        gzip on;
        gzip_types text/css application/javascript application/json application/xml image/svg+xml;
      }

volumes:
  site:

networks:
  traefik:
    external: true

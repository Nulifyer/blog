# Portainer stack "blog" on endpoint 7 (mage).
# git-sync pulls the built site from the `site` branch; nginx serves it; Traefik routes the hostname.
x-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

name: blog

services:
  sync:
    image: registry.k8s.io/git-sync/git-sync:v4.8.0
    restart: unless-stopped
    user: "65533:65533"
    command:
      - --repo=https://github.com/nulifyer/blog
      - --ref=site
      - --depth=1
      - --period=60s
      - --root=/git
      - --link=current
    volumes:
      - site:/git
    logging: *service-logging

  web:
    image: nginx:alpine   # latest mainline; Portainer re-pulls it on redeploy
    restart: unless-stopped
    depends_on: [sync]
    configs:
      - source: nginx-site
        target: /etc/nginx/conf.d/default.conf
      - source: nginx-headers
        target: /etc/nginx/snippets/headers.conf
    volumes:
      - site:/git:ro
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.blog-http.entrypoints=web"
      - "traefik.http.routers.blog-http.rule=Host(`blog.swarm.nulteck.com`)"
      - "traefik.http.routers.blog-http.middlewares=https-redirect"

      - "traefik.http.routers.blog-https.entrypoints=websecure"
      - "traefik.http.routers.blog-https.rule=Host(`blog.swarm.nulteck.com`)"
      - "traefik.http.services.blog.loadbalancer.server.scheme=http"
      - "traefik.http.services.blog.loadbalancer.server.port=80"
    logging: *service-logging

configs:
  nginx-site:
    content: |
      server {
        listen 80;
        server_name _;
        root /git/current;
        index index.html;
        charset utf-8;
        charset_types text/css application/javascript application/json application/xml text/xml application/rss+xml image/svg+xml;
        server_tokens off;
        absolute_redirect off;
        error_page 404 /404.html;

        gzip on;
        gzip_types text/css application/javascript application/json application/xml application/rss+xml image/svg+xml text/plain;

        # nginx drops server-level add_header in any location that sets its own,
        # so each location includes the shared headers.

        # Pages, feeds and the search index: always revalidate so new builds show up.
        location / {
          include /etc/nginx/snippets/headers.conf;
          add_header Cache-Control "no-cache" always;
          try_files $$uri $$uri/ =404;
        }

        # Fingerprinted CSS/JS and Hugo-processed images never change under the same name.
        location ~* "(\.[0-9a-f]{32,}\.(css|js)|_hu_[0-9a-f]+\.[a-z0-9]+)$$" {
          include /etc/nginx/snippets/headers.conf;
          add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location ~* \.(png|jpe?g|gif|webp|svg|ico|woff2?|ttf)$$ {
          include /etc/nginx/snippets/headers.conf;
          add_header Cache-Control "public, max-age=86400" always;
        }

        location ~* \.webmanifest$$ {
          types { }
          default_type application/manifest+json;
          include /etc/nginx/snippets/headers.conf;
          add_header Cache-Control "public, max-age=86400" always;
        }

        location ~ /\.git { deny all; }
      }

  nginx-headers:
    content: |
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header X-Frame-Options "DENY" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
      # Inline scripts/styles come from the theme; README images load from GitHub and badge hosts.
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

volumes:
  site:

networks:
  traefik:
    external: true

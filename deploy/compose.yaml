# Self-contained blog stack: no CI, no registry. Point it at any git URL that holds the site source.
#
#   builder  clones the repo, rebuilds with Hugo when the branch changes (checked every minute)
#            and every hour for fresh GitHub data, then switches `current` to the new build.
#   web      nginx serving `current` read-only; Traefik routes the hostname to it.
#
# Stack environment variables (set in Portainer, not in this file):
#   GIT_REPO           required  e.g. https://github.com/nulifyer/blog.git
#                                private repo: https://<user>:<token>@host/owner/blog.git
#   SITE_HOST          required  public hostname, e.g. nulteck.com (www.<host> redirects to it)
#   BASE_URL           optional  default https://${SITE_HOST}/
#   HUGO_GITHUB_TOKEN  optional  raises GitHub's API limit (60 -> 5,000 requests/hour); not needed
#   GIT_BRANCH         optional  default main
#   POLL_SECONDS       optional  default 60
#   REFRESH_SECONDS    optional  default 3600, rebuild interval without commits

x-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

name: blog

services:
  builder:
    image: ghcr.io/gohugoio/hugo:v0.170.1
    restart: unless-stopped
    entrypoint: ["sh", "/etc/blog/build-loop.sh"]
    environment:
      GIT_REPO: ${GIT_REPO:?set GIT_REPO}
      GIT_BRANCH: ${GIT_BRANCH:-main}
      SITE_HOST: ${SITE_HOST:?set SITE_HOST}
      BASE_URL: ${BASE_URL:-}
      HUGO_GITHUB_TOKEN: ${HUGO_GITHUB_TOKEN:-}
      POLL_SECONDS: ${POLL_SECONDS:-60}
      REFRESH_SECONDS: ${REFRESH_SECONDS:-3600}
    configs:
      - source: build-loop
        target: /etc/blog/build-loop.sh
    volumes:
      - data:/project        # the image's /project is owned by its non-root hugo user
    healthcheck:
      test: ["CMD", "test", "-f", "/project/current/index.html"]
      interval: 15s
      start_period: 10m
    logging: *service-logging

  web:
    image: nginx:alpine   # latest mainline; Portainer re-pulls it on redeploy
    restart: unless-stopped
    depends_on:
      builder:
        condition: service_healthy   # wait for the first successful build
    configs:
      - source: nginx-site
        target: /etc/nginx/conf.d/default.conf
      - source: nginx-headers
        target: /etc/nginx/snippets/headers.conf
    volumes:
      - data:/data:ro
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.services.blog.loadbalancer.server.port=80"

      # Public site on the external entrypoints (the abuse check is attached to them).
      - "traefik.http.routers.blog-public.entrypoints=websecureEx"
      - "traefik.http.routers.blog-public.rule=Host(`${SITE_HOST:?set SITE_HOST}`)"
      - "traefik.http.routers.blog-public.service=blog"
      - "traefik.http.routers.blog-public-http.entrypoints=webEx"
      - "traefik.http.routers.blog-public-http.rule=Host(`${SITE_HOST:?set SITE_HOST}`) || Host(`www.${SITE_HOST:?set SITE_HOST}`)"
      - "traefik.http.routers.blog-public-http.middlewares=https-redirect"
      - "traefik.http.routers.blog-public-http.service=blog"

      # www -> bare domain.
      - "traefik.http.routers.blog-www.entrypoints=websecureEx"
      - "traefik.http.routers.blog-www.rule=Host(`www.${SITE_HOST:?set SITE_HOST}`)"
      - "traefik.http.routers.blog-www.middlewares=blog-to-site"
      - "traefik.http.routers.blog-www.service=blog"

      - "traefik.http.middlewares.blog-to-site.redirectregex.regex=^https?://[^/]+/?(.*)$$"
      - "traefik.http.middlewares.blog-to-site.redirectregex.replacement=https://${SITE_HOST:?set SITE_HOST}/$${1}"
      - "traefik.http.middlewares.blog-to-site.redirectregex.permanent=true"
    logging: *service-logging

configs:
  build-loop:
    content: |
      # Clone/pull the site, build with Hugo, publish by switching the `current` symlink.
      set -u
      W=/project
      SRC=$$W/src
      KEEP=3
      RETRY_SECONDS=300
      export HUGO_CACHEDIR=$$W/cache
      BASE_URL=$${BASE_URL:-https://$$SITE_HOST/}
      mkdir -p "$$W/releases" "$$W/cache"
      git config --global --add safe.directory '*'
      trap 'exit 0' TERM INT
      log() { echo "$$(date -u +%FT%TZ) $$*"; }

      sync_repo() {
        if [ ! -d "$$SRC/.git" ]; then
          rm -rf "$$SRC"
          git clone --quiet --depth 1 --branch "$$GIT_BRANCH" --recurse-submodules --shallow-submodules "$$GIT_REPO" "$$SRC"
        else
          git -C "$$SRC" fetch --quiet --depth 1 origin "$$GIT_BRANCH" &&
          git -C "$$SRC" reset --quiet --hard FETCH_HEAD &&
          git -C "$$SRC" clean -ffdq &&
          git -C "$$SRC" submodule update --quiet --init --recursive --depth 1
        fi
      }

      build() {
        rev=$$(git -C "$$SRC" rev-parse --short HEAD)
        name=$$(date -u +%Y%m%dT%H%M%SZ)-$$rev
        log "building $$rev"
        if hugo build --source "$$SRC" --destination "$$W/releases/$$name" --minify --gc --baseURL "$$BASE_URL"; then
          ln -sfn "releases/$$name" "$$W/current.next" && mv -fT "$$W/current.next" "$$W/current"
          ls -1d "$$W"/releases/* | sort -r | tail -n +$$((KEEP + 1)) | xargs -r rm -rf
          log "published $$rev"
        else
          rm -rf "$$W/releases/$$name"
          log "BUILD FAILED for $$rev; still serving the previous build"
          return 1
        fi
      }

      last=""
      next_at=0
      while true; do
        if sync_repo; then
          head=$$(git -C "$$SRC" rev-parse HEAD)
          now=$$(date +%s)
          if [ "$$head" != "$$last" ] || [ "$$now" -ge "$$next_at" ]; then
            if build; then next_at=$$((now + REFRESH_SECONDS)); else next_at=$$((now + RETRY_SECONDS)); fi
            last=$$head
          fi
        else
          log "could not fetch $$GIT_BRANCH; retrying"
        fi
        sleep "$$POLL_SECONDS" & wait $$!
      done

  nginx-site:
    content: |
      server {
        listen 80;
        server_name _;
        root /data/current;
        index index.html;
        charset utf-8;
        charset_types text/css application/javascript application/json application/xml text/xml application/rss+xml image/svg+xml;
        server_tokens off;
        absolute_redirect off;
        error_page 404 /404.html;

        gzip on;
        gzip_types text/css application/javascript application/json application/xml application/rss+xml image/svg+xml text/plain;

        # nginx drops server-level add_header in any location that sets its own,
        # so each location includes the shared headers.

        # Pages, feeds and the search index: always revalidate so new builds show up.
        location / {
          include /etc/nginx/snippets/headers.conf;
          add_header Cache-Control "no-cache" always;
          try_files $$uri $$uri/ =404;
        }

        # Fingerprinted CSS/JS/fonts and Hugo-processed images never change under the same name.
        location ~* "(\.[0-9a-f]{32,}\.(css|js|woff2)|_hu_[0-9a-f]+\.[a-z0-9]+)$$" {
          include /etc/nginx/snippets/headers.conf;
          add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location ~* \.(png|jpe?g|gif|webp|svg|ico|woff2?|ttf)$$ {
          include /etc/nginx/snippets/headers.conf;
          add_header Cache-Control "public, max-age=2592000" always;
        }

        location ~* \.webmanifest$$ {
          types { }
          default_type application/manifest+json;
          include /etc/nginx/snippets/headers.conf;
          add_header Cache-Control "public, max-age=86400" always;
        }
      }

  nginx-headers:
    content: |
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header X-Frame-Options "DENY" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
      # Inline scripts/styles come from the theme; README images load from GitHub and badge hosts.
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

volumes:
  data:

networks:
  traefik:
    external: true
